spring:
  application:
    name: com.gurujadhav.atomurl

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/atomurl_db
    username: ${DB_USERNAME:atomuser}
    password: ${DB_PASSWORD:atompassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway creates the tables, Hibernate validates them
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

cachecore:
    domain: ${CACHECORE_DOMAIN:localhost}
    port: ${CACHECORE_PORT:6948}

jwt:
  secret: ${JWT_SECRET:dummy-jwt-secret-key-must-be-at-least-32-bytes-long}

oauth:
  github:
    client-id: ${GITHUB_CLIENT_ID:dummy-github-client-id}
    client-secret: ${GITHUB_CLIENT_SECRET:dummy-github-client-secret}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/auth/oauth/github/callback}

  google:
    client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
    client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/oauth/google/callback}
