PORT=6948

# DB[0] URLs Cache: True LRU + TTL. Source of truth is PostgreSQL.
DB maxCapacity=10000 ttl=86400 evictInterval=60

# DB[1] Auth OTPs: 5-minute validation window (300s).
DB maxCapacity=10000 ttl=300 evictInterval=30

# DB[2] Rate Limiting: High-capacity to prevent LRU flush attack; evicted purely by 60s TTL.
DB maxCapacity=100000 ttl=60 evictInterval=10

