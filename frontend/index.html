    <!-- Synchronously apply saved theme BEFORE paint to prevent theme flash (FOUC) -->

      (function() {
        try {
          var t = localStorage.getItem('atom_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);

      })();
    </script>
